; CustomStorage -- singleplayer
; All weights use the game's internal weight unit (kg).
; BaseWeight is informational: factory container limits or the measured player limit.
; Weight=default preserves the game's limit.
; Set Weight to a number >= 1, or a multiplier such as 3x.
; Restart VEIN after editing this file.

